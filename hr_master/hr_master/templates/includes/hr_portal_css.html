<style>
/* ============================================================
   HR Master — Recruiting Portal · Professional Theme
   Rich indigo/violet brand on a deep-navy luxe shell
   (inlined so the portal renders styled without the /assets/ server)
   ============================================================ */

:root {
  /* Brand */
  --hrp-primary: #4f46e5;
  --hrp-primary-dark: #4338ca;
  --hrp-primary-deep: #3730a3;
  --hrp-violet: #7c3aed;
  --hrp-fuchsia: #c026d3;
  --hrp-accent: #f59e0b;
  --hrp-accent-soft: #fbbf24;

  /* Surfaces */
  --hrp-ink: #0b1220;          /* deep navy for nav/footer/hero */
  --hrp-ink-2: #111a2e;
  --hrp-bg: #f3f5fb;
  --hrp-card: #ffffff;
  --hrp-border: #e5e8f2;
  --hrp-border-strong: #d5d9ea;

  /* Text */
  --hrp-text: #101828;
  --hrp-muted: #64708a;
  --hrp-subtle: #98a2b8;
  --hrp-heading: var(--hrp-ink);

  /* Status */
  --hrp-green: #059669;  --hrp-green-bg: #ecfdf5;  --hrp-green-border: #a7f3d0;
  --hrp-blue: #1d4ed8;   --hrp-blue-bg: #eff6ff;   --hrp-blue-border: #bfdbfe;
  --hrp-orange: #b45309; --hrp-orange-bg: #fffbeb; --hrp-orange-border: #fde68a;
  --hrp-red: #b91c1c;    --hrp-red-bg: #fef2f2;    --hrp-red-border: #fecaca;
  --hrp-purple: #6d28d9; --hrp-purple-bg: #f5f3ff; --hrp-purple-border: #ddd6fe;
  --hrp-gray: #475569;   --hrp-gray-bg: #f8fafc;   --hrp-gray-border: #e2e8f0;

  /* Shape & shadow */
  --hrp-radius: 16px;
  --hrp-radius-sm: 10px;
  --hrp-shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);
  --hrp-shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);
  --hrp-shadow-lg: 0 16px 40px rgba(16, 24, 40, 0.14);
  --hrp-grad: linear-gradient(135deg, var(--hrp-primary) 0%, var(--hrp-violet) 55%, var(--hrp-fuchsia) 120%);
  --hrp-grad-soft: linear-gradient(135deg, rgba(79, 70, 229, 0.10), rgba(124, 58, 237, 0.10));
}

* { box-sizing: border-box; }

body.hrp-body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background:
    radial-gradient(900px 420px at 85% -120px, rgba(124, 58, 237, 0.10), transparent 60%),
    radial-gradient(700px 360px at -60px 40px, rgba(79, 70, 229, 0.09), transparent 55%),
    var(--hrp-bg);
  background-attachment: fixed;
  color: var(--hrp-text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(79, 70, 229, 0.18); color: var(--hrp-primary-deep); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #c7cde0; border-radius: 999px; border: 2px solid var(--hrp-bg); }
::-webkit-scrollbar-thumb:hover { background: #aab2cc; }

/* ============================================================
   Top navigation — dark luxe shell
   ============================================================ */
.hrp-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, var(--hrp-ink) 0%, #0d1426 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 24px rgba(11, 18, 32, 0.35);
  transition: box-shadow 0.25s ease;
}
.hrp-nav.hrp-scrolled { box-shadow: 0 12px 32px rgba(11, 18, 32, 0.55); }
.hrp-nav-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 24px;
  height: 68px;
  display: flex;
  align-items: center;
  gap: 20px;
}

/* Brand */
.hrp-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  flex-shrink: 0;
}
.hrp-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--hrp-grad);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 6px 16px rgba(99, 91, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  flex-shrink: 0;
}
.hrp-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.hrp-brand-text strong {
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.hrp-brand-text em {
  font-style: normal;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--hrp-accent-soft);
}

/* Nav links */
.hrp-nav-links {
  display: flex;
  gap: 4px;
  flex: 1;
  align-items: center;
}
.hrp-nav-links a {
  padding: 9px 16px;
  border-radius: 999px;
  color: #b9c1d6;
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  transition: all 0.18s ease;
}
.hrp-nav-links a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.hrp-nav-links a.hrp-active {
  background: var(--hrp-grad);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(99, 91, 255, 0.4);
}
.hrp-nav-links a.hrp-desk-link {
  margin-left: 6px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #d7dcea;
}
.hrp-nav-links a.hrp-desk-link:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

/* User chip */
.hrp-nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.hrp-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--hrp-grad);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}
.hrp-username {
  color: #dfe4f0;
  font-size: 13px;
  font-weight: 500;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hrp-btn-logout {
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: #cdd4e6;
  padding: 7px 14px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.18s ease;
}
.hrp-btn-logout:hover {
  background: rgba(225, 29, 72, 0.16);
  border-color: rgba(244, 63, 94, 0.55);
  color: #fda4af;
}

/* Mobile nav toggle */
.hrp-nav-toggle {
  display: none;
  margin-left: auto;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* Theme toggle */
.hrp-theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.18s ease;
}
.hrp-theme-toggle:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }

/* ============================================================
   Layout
   ============================================================ */
.hrp-container {
  max-width: 1320px;
  margin: 0 auto;
  padding: 36px 24px 72px;
}

/* Page head — tinted panel with gradient accent bar */
.hrp-page-head {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  background: linear-gradient(120deg, rgba(79, 70, 229, 0.07), rgba(124, 58, 237, 0.09) 60%, rgba(192, 38, 211, 0.05));
  border: 1px solid rgba(99, 91, 255, 0.16);
  border-radius: var(--hrp-radius);
  padding: 22px 26px;
  overflow: hidden;
}
.hrp-page-head::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--hrp-grad);
  border-radius: 0 4px 4px 0;
}
.hrp-page-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--hrp-heading);
  line-height: 1.15;
}
.hrp-page-sub {
  color: var(--hrp-muted);
  margin: 6px 0 0;
  font-size: 14.5px;
}
.hrp-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hrp-ai-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
@media (max-width: 480px) { .hrp-ai-grid { grid-template-columns: 1fr; } }

/* AI chat (type a question → get an answer) */
.hrp-chat {
  border: 1px solid var(--hrp-border);
  border-radius: 14px;
  background: #f6f8fd;
  padding: 12px;
  margin-top: 12px;
}
.hrp-chat-output {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 320px;
  overflow-y: auto;
  padding: 4px 2px;
  margin-bottom: 10px;
}
.hrp-chat-row { display: flex; }
.hrp-chat-user { justify-content: flex-end; }
.hrp-chat-ai { justify-content: flex-start; }
.hrp-chat-bubble {
  max-width: 85%;
  padding: 9px 13px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.hrp-chat-ai .hrp-chat-bubble {
  background: #fff;
  border: 1px solid var(--hrp-border);
  border-bottom-left-radius: 4px;
  color: var(--hrp-text);
  box-shadow: var(--hrp-shadow);
}
.hrp-chat-user .hrp-chat-bubble {
  background: var(--hrp-grad);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 12px rgba(99, 91, 255, 0.3);
}
.hrp-chat-suggest {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.hrp-chat-suggest .hrp-chip {
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}
.hrp-chat-suggest .hrp-chip:hover {
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(99, 91, 255, 0.28);
  filter: brightness(1.05);
}
.hrp-chat-suggest .hrp-chip:active { transform: translateY(0); }
.hrp-chat-suggest .hrp-chip:focus-visible { outline: 2px solid var(--hrp-primary); outline-offset: 2px; }
.hrp-chat-input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.hrp-chat-input-row textarea {
  flex: 1;
  resize: vertical;
  min-height: 42px;
  max-height: 130px;
  padding: 9px 12px;
  border: 1px solid var(--hrp-border-strong);
  border-radius: 10px;
  font-size: 13.5px;
  font-family: inherit;
  background: #fff;
  color: var(--hrp-text);
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}
.hrp-chat-input-row textarea:focus {
  outline: none;
  border-color: var(--hrp-primary);
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.14);
}
.hrp-chat-input-row textarea::placeholder { color: var(--hrp-subtle); }
html[data-theme="dark"] .hrp-chat { background: #0f1730; border-color: var(--hrp-border-strong); }
html[data-theme="dark"] .hrp-chat-ai .hrp-chat-bubble { background: #1a2240; border-color: var(--hrp-border-strong); }
html[data-theme="dark"] .hrp-chat-input-row textarea { background: #0f1730; color: var(--hrp-text); }
html[data-theme="dark"] .hrp-chat-input-row textarea::placeholder { color: var(--hrp-subtle); }

/* ============================================================
   Buttons
   ============================================================ */
.hrp-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  font-family: inherit;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.hrp-btn-lg { padding: 13px 24px; font-size: 15px; border-radius: 14px; }
.hrp-btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
.hrp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.hrp-btn:focus-visible { outline: 2px solid var(--hrp-primary); outline-offset: 2px; }

.hrp-btn-primary {
  background: var(--hrp-grad);
  color: #fff;
  box-shadow: 0 6px 18px rgba(99, 91, 255, 0.35);
}
.hrp-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(99, 91, 255, 0.45); filter: brightness(1.04); }
.hrp-btn-primary:active { transform: translateY(0); }

.hrp-btn-secondary {
  background: #fff;
  color: var(--hrp-text);
  border-color: var(--hrp-border-strong);
  box-shadow: var(--hrp-shadow);
}
.hrp-btn-secondary:hover { border-color: var(--hrp-primary); color: var(--hrp-primary); transform: translateY(-1px); box-shadow: var(--hrp-shadow-md); }

.hrp-btn-success { background: linear-gradient(135deg, #059669, #10b981); color: #fff; box-shadow: 0 5px 14px rgba(5, 150, 105, 0.3); }
.hrp-btn-success:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 9px 22px rgba(5, 150, 105, 0.4); }

.hrp-btn-danger { background: linear-gradient(135deg, #e11d48, #f43f5e); color: #fff; box-shadow: 0 5px 14px rgba(225, 29, 72, 0.3); }
.hrp-btn-danger:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 9px 22px rgba(225, 29, 72, 0.4); }

.hrp-btn-warning { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; box-shadow: 0 5px 14px rgba(217, 119, 6, 0.3); }
.hrp-btn-warning:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 9px 22px rgba(217, 119, 6, 0.4); }

.hrp-btn-glass {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.3);
  color: #fff;
  backdrop-filter: blur(6px);
}
.hrp-btn-glass:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

/* ============================================================
   Cards & grids
   ============================================================ */
.hrp-grid { display: grid; gap: 22px; }
.hrp-grid-4 { grid-template-columns: repeat(4, 1fr); }
.hrp-grid-3 { grid-template-columns: repeat(3, 1fr); }
.hrp-grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1080px) {
  .hrp-grid-4 { grid-template-columns: repeat(2, 1fr); }
  .hrp-grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .hrp-grid-4, .hrp-grid-3, .hrp-grid-2 { grid-template-columns: 1fr; }
}

.hrp-card {
  background: var(--hrp-card);
  border: 1px solid var(--hrp-border);
  border-radius: var(--hrp-radius);
  box-shadow: var(--hrp-shadow);
  padding: 22px;
  transition: box-shadow 0.22s ease, transform 0.22s ease, border-color 0.22s ease;
  animation: hrpFadeUp 0.5s ease both;
}
.hrp-card:nth-child(2) { animation-delay: 0.05s; }
.hrp-card:nth-child(3) { animation-delay: 0.1s; }
.hrp-card:nth-child(4) { animation-delay: 0.15s; }
.hrp-card:nth-child(5) { animation-delay: 0.2s; }
.hrp-card:nth-child(6) { animation-delay: 0.25s; }
.hrp-card:nth-child(7) { animation-delay: 0.3s; }
.hrp-card:nth-child(8) { animation-delay: 0.35s; }
.hrp-card-hover:hover {
  box-shadow: var(--hrp-shadow-lg);
  transform: translateY(-3px);
  border-color: rgba(99, 91, 255, 0.35);
}
.hrp-card-title {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--hrp-muted);
  margin: 0 0 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hrp-card-title::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--hrp-grad);
  flex-shrink: 0;
}

@keyframes hrpFadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   Hero (dashboard)
   ============================================================ */
.hrp-hero {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  background:
    radial-gradient(640px 300px at 90% -60px, rgba(124, 58, 237, 0.55), transparent 60%),
    radial-gradient(520px 280px at -40px 120%, rgba(79, 70, 229, 0.5), transparent 60%),
    linear-gradient(135deg, var(--hrp-ink) 0%, #141b34 55%, #1c1440 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 24px 60px rgba(11, 18, 32, 0.35);
  padding: 44px 44px;
  margin-bottom: 30px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
  animation: hrpFadeUp 0.55s ease both;
}
.hrp-hero-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.5;
  pointer-events: none;
}
.hrp-hero-glow-1 { width: 260px; height: 260px; background: var(--hrp-violet); top: -120px; right: 8%; }
.hrp-hero-glow-2 { width: 200px; height: 200px; background: var(--hrp-fuchsia); bottom: -110px; left: 30%; opacity: 0.35; }
.hrp-hero-content { position: relative; z-index: 1; max-width: 640px; }
.hrp-hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--hrp-accent-soft);
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.35);
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 16px;
}
.hrp-hero-title {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 8px;
  line-height: 1.1;
}
.hrp-hero-sub {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.75);
  margin: 0 0 24px;
  max-width: 520px;
}
.hrp-hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.hrp-hero-metric {
  position: relative;
  z-index: 1;
  text-align: center;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 18px;
  padding: 20px 30px;
  backdrop-filter: blur(8px);
  min-width: 210px;
}
.hrp-hero-metric-value {
  display: block;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(120deg, #fff, var(--hrp-accent-soft));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.hrp-hero-metric-label {
  display: block;
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.72);
  margin-top: 4px;
  letter-spacing: 0.02em;
}

/* ============================================================
   KPI cards
   ============================================================ */
a.hrp-kpi {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
a.hrp-kpi:focus-visible { outline: 2px solid var(--hrp-primary); outline-offset: 2px; }
.hrp-kpi::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--kpi-accent, var(--hrp-grad));
  opacity: 0.9;
}
.hrp-kpi-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.hrp-kpi-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  /* Fallbacks for browsers without color-mix() support */
  background: var(--hrp-grad-soft);
  border: 1px solid rgba(99, 91, 255, 0.22);
  background: color-mix(in srgb, var(--kpi-accent, var(--hrp-primary)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--kpi-accent, var(--hrp-primary)) 35%, transparent);
  color: var(--kpi-accent, var(--hrp-primary));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
}
.hrp-kpi-icon svg {
  width: 23px;
  height: 23px;
}
.hrp-kpi:hover .hrp-kpi-icon {
  transform: scale(1.12) rotate(-5deg);

   Smooth theme transition

<script>
/* Theme init — set before first paint to avoid a light flash.
   The theme is persisted per-user in the database and injected into the
   page context (set_portal_context), so it follows the user across
   browsers/devices without relying on localStorage. Falls back to the
   OS preference only when nothing is saved yet. The browser address-bar
   color (theme-color meta) is synced to the applied theme too. */
(function () {
	var t = "{{ hr_portal_theme or '' }}";
	if (t !== "dark" && t !== "light") {
		t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
	}
	document.documentElement.setAttribute("data-theme", t);
	var themeColorMeta = document.querySelector('meta[name="theme-color"]');
	if (themeColorMeta) {
		themeColorMeta.setAttribute("content", t === "dark" ? "#0d1426" : "#f3f5fb");
	}
})();
</script>
