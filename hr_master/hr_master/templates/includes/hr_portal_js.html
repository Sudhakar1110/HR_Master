<script>
/* HR Master — Recruiting Portal helpers (inlined so the portal works without the /assets/ server) */
(function () {
	"use strict";

	function onReady(fn) {
		if (document.readyState !== "loading") { fn(); }
		else { document.addEventListener("DOMContentLoaded", fn); }
	}

	onReady(function () {
		var nav = document.getElementById("hrpNav");

		/* Scroll shadow on the dark nav + back-to-top visibility */
		var backTop = document.getElementById("hrpBackTop");
		var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

		function onScroll() {
			if (nav) {
				nav.classList.toggle("hrp-scrolled", window.scrollY > 8);
			}
			if (backTop) {
				backTop.classList.toggle("hrp-visible", window.scrollY > 400);
			}
		}
		window.addEventListener("scroll", onScroll, { passive: true });
		onScroll();

		/* Smooth scroll to top */
		if (backTop) {
			backTop.addEventListener("click", function () {
				window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
			});
		}

		/* Close the mobile nav when a link inside it is clicked */
		document.querySelectorAll("#hrpNavLinks a").forEach(function (link) {
			link.addEventListener("click", function () {
				var links = document.getElementById("hrpNavLinks");
				if (links) { links.classList.remove("hrp-open"); }
			});
		});

		/* Auto-dismiss flash alerts after 5 seconds (or on click) */
		document.querySelectorAll(".hrp-alert[data-dismiss]").forEach(function (el) {
			el.style.cursor = "pointer";
			el.title = "Click to dismiss";
			var dismiss = function () {
				el.style.transition = "opacity 0.4s ease, transform 0.4s ease";
				el.style.opacity = "0";
				el.style.transform = "translateY(-6px)";
				setTimeout(function () { el.remove(); }, 400);
			};
			el.addEventListener("click", dismiss);
			setTimeout(dismiss, 5000);
		});

		/* Count-up animation for KPI values */
		document.querySelectorAll(".hrp-kpi-value[data-count]").forEach(function (el) {
			var target = parseFloat(el.getAttribute("data-count") || "0");
			var decimals = (target % 1 !== 0) ? 1 : 0;
			var duration = 900;
			var start = null;

			function frame(ts) {
				if (!start) { start = ts; }
				var progress = Math.min((ts - start) / duration, 1);
				/* ease-out cubic */
				var eased = 1 - Math.pow(1 - progress, 3);
				var current = target * eased;
				el.textContent = decimals
					? current.toFixed(decimals)
					: Math.round(current).toString();
				if (progress < 1) { requestAnimationFrame(frame); }
			}
			requestAnimationFrame(frame);
		});

		/* Dark / light theme toggle (persisted in localStorage) */
		var themeToggle = document.getElementById("hrpThemeToggle");
		var themeIcons = { dark: "☀️", light: "🌙" };
		function currentTheme() {
			return document.documentElement.getAttribute("data-theme") || "light";
		}
		var themeTimer = null;
		var themeColors = { dark: "#0d1426", light: "#f3f5fb" };
		/* Keep the browser address-bar color (theme-color meta) in sync with
		   the applied theme, so it no longer stays a fixed dark navy. */
		function syncThemeColor(theme) {
			var meta = document.querySelector('meta[name="theme-color"]');
			if (meta) {
				meta.setAttribute("content", themeColors[theme] || "#0b1220");
			}
		}
		/* Persist the theme per-user in the database (User Defaults) so it
		   follows the user across browsers/devices. Non-fatal on failure — the
		   theme still applies for this session. */
		function persistTheme(theme) {
			var csrfMeta = document.querySelector('meta[name="csrf-token"]');
			try {
				fetch("/api/method/hr_master.api.portal_actions.set_portal_theme", {
					method: "POST",
					headers: {
						"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
						"X-Frappe-CSRF-Token": csrfMeta ? csrfMeta.getAttribute("content") : ""
					},
					body: "theme=" + encodeURIComponent(theme),
					credentials: "same-origin"
				}).catch(function () { /* non-fatal */ });
			} catch (e) {}
		}
		function applyTheme(theme) {
			var root = document.documentElement;
			var isChange = currentTheme() !== theme;
			if (isChange) {
				/* Add a temporary class that enables CSS color transitions so the
				   switch fades smoothly, then remove it once the animation ends
				   so normal hover transitions behave as usual. The timer is
				   cleared on every toggle so a rapid double-click never cuts the
				   second fade short. */
				root.classList.add("hrp-theme-transition");
				root.setAttribute("data-theme", theme);
			}
			if (themeToggle) {
				themeToggle.textContent = themeIcons[theme] || "🌙";
				themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
				if (isChange) {
					themeToggle.classList.remove("hrp-theme-flip");
					void themeToggle.offsetWidth; /* restart the flip on rapid clicks */
					themeToggle.classList.add("hrp-theme-flip");
				}
			}
			syncThemeColor(theme);
			if (isChange) {
				persistTheme(theme);
				clearTimeout(themeTimer);
				themeTimer = window.setTimeout(function () {
					root.classList.remove("hrp-theme-transition");
				}, 400);
			}
		}
		if (themeToggle) {
			applyTheme(currentTheme()); /* sync the button icon with the init-time theme */
			themeToggle.addEventListener("click", function () {
				applyTheme(currentTheme() === "dark" ? "light" : "dark");
			});
		}

		/* AI Assist (JD page) — call whitelisted AI endpoints via fetch and
		   render suggestions / interview questions inline. No-op unless the
		   #hrpAiOutput container exists. */
		var aiOutput = document.getElementById("hrpAiOutput");
		var aiQuestionsBtn = document.getElementById("hrpAiQuestions");
		var aiSkillsBtn = document.getElementById("hrpAiSkills");
		var aiSummaryBtn = document.getElementById("hrpAiSummary");
		var aiScreenBtn = document.getElementById("hrpAiScreen");
		var aiKeywordsBtn = document.getElementById("hrpAiKeywords");
		var aiSalaryBtn = document.getElementById("hrpAiSalary");
		if (aiOutput && (aiQuestionsBtn || aiSkillsBtn || aiSummaryBtn || aiScreenBtn || aiKeywordsBtn || aiSalaryBtn)) {
			var aiCsrf = document.querySelector('meta[name="csrf-token"]');
			var aiCsrfToken = aiCsrf ? aiCsrf.getAttribute("content") : "";

			function aiCall(endpoint, body) {
				return fetch(endpoint, {
					method: "POST",
					headers: {
						"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
						"X-Frappe-CSRF-Token": aiCsrfToken
					},
					body: body,
					credentials: "same-origin"
				}).then(function (r) { return r.json(); });
			}

			function aiShowLoading(text) {
				aiOutput.innerHTML = '<span class="hrp-hint">⏳ ' + text + '…</span>';
			}

			function aiShowError(message) {
				aiOutput.innerHTML = '<div class="hrp-alert hrp-alert-error" style="margin-bottom:0">⚠ ' + aiEscape(message || "AI request failed.") + "</div>";
			}

			var aiSectionLabels = {
				technical: "Technical",
				behavioral: "Behavioral",
				"role_specific": "Role Specific",
				"Required Skills": "Required Skills",
				"Preferred Skills": "Preferred Skills",
				"Phone Screen": "Phone Screen",
				"Skill Deep-Dive": "Skill Deep-Dive"
			};

			function aiEscape(text) {
				return String(text == null ? "" : text)
					.replace(/&/g, "&amp;").replace(/</g, "&lt;")
					.replace(/>/g, "&gt;").replace(/"/g, "&quot;");
			}

			function aiRenderSections(sections) {
				var html = "";
				Object.keys(sections || {}).forEach(function (key) {
					var items = sections[key] || [];
					if (!items.length) { return; }
					var label = aiSectionLabels[key] || key;
					html += '<div style="margin-top:10px"><strong>' + aiEscape(label) + "</strong>";
					html += '<ol style="margin:6px 0 0 18px;padding:0">';
					items.forEach(function (item) { html += '<li style="margin-bottom:4px">' + aiEscape(item) + "</li>"; });
					html += "</ol></div>";
				});
				aiOutput.innerHTML = html || '<span class="hrp-hint">No results returned.</span>';
			}

			function aiRenderText(text) {
				aiOutput.innerHTML = '<div style="white-space:pre-wrap;font-size:14px;color:#334155;line-height:1.65">'
					+ aiEscape(text) + "</div>";
			}

			function aiRenderKeywords(keywords) {
				var html = '<div class="hrp-chips">';
				(keywords || []).forEach(function (kw) {
					html += '<span class="hrp-chip hrp-chip-required">' + aiEscape(kw) + "</span>";
				});
				html += "</div>";
				aiOutput.innerHTML = (keywords && keywords.length)
					? html
					: '<span class="hrp-hint">No keywords returned.</span>';
			}

			function aiRun(endpoint, jdName, params, loadingText, sections) {
				aiShowLoading(loadingText);
				var body = "job_description_name=" + encodeURIComponent(jdName);
				Object.keys(params || {}).forEach(function (k) {
					body += "&" + k + "=" + encodeURIComponent(params[k]);
				});
				aiCall(endpoint, body).then(function (data) {
					if (data && data.exc_type) {
						aiShowError((data._server_messages && data._server_messages[0]) || data.message || "AI request failed.");
						return;
					}
					/* Frappe wraps whitelisted returns in {"message": <result>} */
					var result = (data && data.message && typeof data.message === "object") ? data.message : data;
					if (result && result.status === "success") {
						if (result.text) {
							aiRenderText(result.text);
						} else if (result.keywords) {
							aiRenderKeywords(result.keywords);
						} else {
							aiRenderSections(sections || result.questions || { "Required Skills": result.required, "Preferred Skills": result.preferred });
						}
					} else {
						aiShowError((result && result.message) || "Unexpected response.");
					}
				}).catch(function () { aiShowError("Network error while calling the AI service."); });
			}

			if (aiQuestionsBtn) {
				aiQuestionsBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.generate_interview_questions",
						aiQuestionsBtn.getAttribute("data-jd") || "",
						{ count: 6 },
						"Generating interview questions"
					);
				});
			}
			if (aiSkillsBtn) {
				aiSkillsBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.suggest_jd_skills",
						aiSkillsBtn.getAttribute("data-jd") || "",
						{},
						"Suggesting skills"
					);
				});
			}
			if (aiSummaryBtn) {
				aiSummaryBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.suggest_jd_summary",
						aiSummaryBtn.getAttribute("data-jd") || "",
						{},
						"Writing job summary"
					);
				});
			}
			if (aiScreenBtn) {
				aiScreenBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.suggest_screening_questions",
						aiScreenBtn.getAttribute("data-jd") || "",
						{ count: 5 },
						"Writing screening questions"
					);
				});
			}
			if (aiKeywordsBtn) {
				aiKeywordsBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.suggest_search_keywords",
						aiKeywordsBtn.getAttribute("data-jd") || "",
						{},
						"Suggesting search keywords"
					);
				});
			}
			if (aiSalaryBtn) {
				aiSalaryBtn.addEventListener("click", function () {
					aiRun(
						"/api/method/hr_master.api.ai_api.suggest_salary_range",
						aiSalaryBtn.getAttribute("data-jd") || "",
						{},
						"Benchmarking salary range"
					);
				});
			}
		}

		/* Confirm dialog for destructive / state-changing actions */
		document.querySelectorAll("form[data-confirm]").forEach(function (form) {
			form.addEventListener("submit", function (e) {
				var message = form.getAttribute("data-confirm") || "Are you sure?";
				if (!window.confirm(message)) {
					e.preventDefault();
				}
			});
		});

		/* Loading state on submit buttons */
		document.querySelectorAll("form").forEach(function (form) {
			form.addEventListener("submit", function () {
				var btn = form.querySelector('button[type="submit"]');
				if (btn && !btn.disabled) {
					btn.disabled = true;
					btn.textContent = "Working…";
				}
			});
		});

		/* Auto-refresh polling: pages opt in with data-hrp-poll + data-hrp-poll-url.
		   Polls a whitelisted endpoint and reloads once a background job finishes,
		   so search results appear on the JD page without a manual refresh. */
		var pollBody = document.body;
		if (pollBody && pollBody.getAttribute("data-hrp-poll") === "1" && pollBody.getAttribute("data-hrp-poll-url")) {
			var pollUrl = pollBody.getAttribute("data-hrp-poll-url");
			var pollTimer = null;
			var pollTries = 0;
			var maxPollTries = 150; /* ~10 min at 4s, matching the long-queue job timeout */

			function stopPolling() {
				if (pollTimer) {
					clearInterval(pollTimer);
					pollTimer = null;
				}
			}

			function reloadFresh() {
				stopPolling();
				try {
					/* strip flash query params so a stale "Search initiated" message isn't re-shown */
					var url = new URL(window.location.href);
					url.searchParams.delete("msg");
					url.searchParams.delete("type");
					window.location.replace(url.toString());
				} catch (e) {
					window.location.reload();
				}
			}

			function poll() {
				if (document.hidden) { return; } /* pause while the tab is hidden */
				pollTries += 1;
				fetch(pollUrl, { credentials: "same-origin" })
					.then(function (r) { return r.json(); })
					.then(function (data) {
						/* Frappe wraps whitelisted returns in {"message": <result>} */
						var result = (data && data.message && typeof data.message === "object") ? data.message : data;
						if (result && result.status === "success" && !result.in_progress) {
							stopPolling();
							/* When the search finishes, the backend may tell us to go
							   straight to the ranked candidates page — do that. */
							if (result.redirect_url) {
								window.location.href = result.redirect_url;
							} else {
								reloadFresh();
							}
						} else if (pollTries >= maxPollTries) {
							stopPolling();
						}
					})
					.catch(function () {
						if (pollTries >= maxPollTries) { stopPolling(); }
					});
			}

			pollTimer = setInterval(poll, 4000);
			poll(); /* first check immediately */
		}
	});
})();
</script>
