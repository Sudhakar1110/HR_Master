[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hr_master"
version = "15.0.0"
description = "HR Master - AI-powered candidate sourcing and ranking system for ERPNext v15+"
authors = [
    {name = "HR Master Team"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "frappe>=15.0.0",
    "erpnext>=15.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "nltk>=3.8.0",
    "scikit-learn>=1.2.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {include = ["hr_master*"]}}

[tool.setuptools.package-data]
hr_master = [
    "**/*.json",
    "**/*.js",
    "**/*.css",
    "**/*.html",
    "**/*.md",
    "**/*.txt",
    "**/*.py",
]
